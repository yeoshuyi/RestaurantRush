name: CI

on:
  push:
  pull_request:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: run
        run: sh run.sh < /dev/null

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: run
        shell: cmd
        run: call run.bat < nul

  dv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      DV_SEEDS: ${{ github.event.inputs.seeds || '200' }}
      DV_SEED_BASE: ${{ github.event.inputs.seed_base || (github.event_name == 'schedule' && 'random') || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: DV self-tests
        run: python -m unittest discover -s dv/tests -t dv -v
      - name: DV regression (stage 3)
        run: python dv/dv.py regress --stage 3 --seeds ${{ env.DV_SEEDS }} --seed-base ${{ env.DV_SEED_BASE }} --min-cov 100 --out dv/out
      - name: Upload DV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dv-${{ matrix.os }}-py${{ matrix.python }}
          path: dv/out/
          if-no-files-found: ignore
